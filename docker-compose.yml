services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-trustconnect}
      MYSQL_USER: ${DB_USERNAME:-trustconnect}
      MYSQL_PASSWORD: ${DB_PASSWORD:-trustconnect_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-trustconnect_root_local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-trustconnect}
      DB_USERNAME: ${DB_USERNAME:-trustconnect}
      DB_PASSWORD: ${DB_PASSWORD:-trustconnect_local}
    ports:
      - "8081:8081"

volumes:
  mysql_data: