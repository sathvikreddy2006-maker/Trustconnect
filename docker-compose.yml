services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trustconnect}
      POSTGRES_USER: ${DB_USERNAME:-trustconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trustconnect_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trustconnect}
      DB_USERNAME: ${DB_USERNAME:-trustconnect}
      DB_PASSWORD: ${DB_PASSWORD:-trustconnect_local}
    ports:
      - "8081:8081"

volumes:
  postgres_data: